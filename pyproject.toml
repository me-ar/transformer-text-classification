[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textclf"
version = "1.0.0"
description = "Banking77 intent classification: TF-IDF vs embeddings vs DistilBERT fine-tuning vs LoRA"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "src/textclf/experiment.py" = ["E402"] }
